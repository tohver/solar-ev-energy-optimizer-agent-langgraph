[project]
name = "solar-ev-energy-optimizer"
version = "1.0.0"
description = "LangGraph agent for a Munich household: schedules EV charging, heat pump and appliances using live weather, German day-ahead electricity prices, usage history and a RAG knowledge base."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tohver" }]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "httpx>=0.27",
    "langchain-chroma>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pandas>=2.2"]
app = [
    "streamlit>=1.40",
]

[project.scripts]
energy-advisor = "energy_advisor.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_advisor"]

[tool.uv]
default-groups = ["dev"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ forbids naive datetimes: all time handling is time-zone aware (see timeutils.py).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "S", "N", "DTZ"]
ignore = ["E501"]  # line length is handled by the formatter; long strings are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]   # assert and non-crypto random are fine in tests
"src/energy_advisor/data/seed.py" = ["S311"]  # synthetic sample data, not cryptography
"src/energy_advisor/domain/climate.py" = ["S311"]  # synthetic weather, not cryptography
"src/energy_advisor/clients/prices/synthetic.py" = ["S311"]
"src/energy_advisor/services/weather.py" = ["S311"]  # synthetic fallback weather

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration and not llm'"
markers = [
    "integration: calls real external HTTP APIs (needs internet)",
    "llm: calls a real LLM / embeddings API (needs OPENAI_API_KEY, costs money)",
]
filterwarnings = ["ignore::DeprecationWarning:chromadb.*"]

[tool.coverage.run]
source = ["energy_advisor"]
omit = ["*/cli.py", "*/viz/*"]

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
packages = ["energy_advisor"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true

# Plotting code: matplotlib/pandas stubs are very strict about array-like and rcParams types;
# the charts are checked loosely, everything else in strict mode.
[[tool.mypy.overrides]]
module = ["energy_advisor.viz.*"]
disallow_untyped_calls = false
disable_error_code = ["arg-type", "index", "no-any-return"]
