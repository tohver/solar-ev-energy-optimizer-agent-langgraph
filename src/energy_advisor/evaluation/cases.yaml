# Evaluation cases for `energy-advisor eval`.
# expected_tools: tools the agent should call. search_energy_tips is listed everywhere because the system
# prompt requires it for every answer. expected_response: what the LLM judge checks for.

- id: ev_charging_1
  question: When should I charge my electric car tomorrow to minimize cost and maximize solar power?
  expected_tools:
  - find_cheapest_window
  - search_energy_tips
  expected_response: Says that no deadline was given and that it planned for the next 24 hours, asks by when the
    car is needed, and gives the charging hours from now (local time) with their cost in EUR, combining solar and
    prices; notes if prices are an estimate.
- id: ev_charging_2
  question: I need my EV charged with 30 kWh by 7:00 next Monday morning. What is the cheapest window and what will
    it cost?
  expected_tools:
  - find_cheapest_window
  - search_energy_tips
  expected_response: A charging window that ends before 07:00 on the correct date (next Monday, not a past day),
    based on the cheapest hours of the dynamic tariff, with the charging duration at 11 kW and the cost in EUR.
- id: heat_pump_1
  question: Electricity is expensive tomorrow evening. How should I run my heat pump to stay warm but pay less?
  expected_tools:
  - get_electricity_prices
  - get_weather_forecast
  - search_energy_tips
  expected_response: Pre-heating during cheap or sunny hours before the expensive evening hours, a specific temperature
    setpoint in degrees Celsius (e.g. 1-2 degrees higher before the peak), the expensive hours named, and heat pump
    tips cited from the knowledge base.
- id: heat_pump_2
  question: It is getting colder this week. How can I keep the heat pump bill low without being cold?
  expected_tools:
  - get_weather_forecast
  - search_energy_tips
  expected_response: 'Advice based on the forecast temperatures: setpoints in degrees Celsius, lower flow temperature,
    avoiding the electric backup heater, using cheap/sunny hours, with tips cited from the knowledge base.'
- id: appliance_1
  question: My dishwasher needs about 1 kWh. How much can I save by running it in the cheapest hours before 18:00
    tomorrow instead of starting it right now?
  expected_tools:
  - find_cheapest_window
  - search_energy_tips
  expected_response: Gives the cheapest start time before the deadline from the scheduling tool, its cost and the
    saving per cycle in EUR versus starting now, and extrapolates the saving per year.
- id: appliance_2
  question: When is the best time this week to run my washing machine and dryer?
  expected_tools:
  - find_cheapest_window
  - search_energy_tips
  expected_response: Specific days and hours for washer and dryer based on solar forecast and/or low prices, with
    reasoning.
- id: solar_1
  question: How can I use more of my own solar power instead of exporting it? Look at my last week of solar generation.
  expected_tools:
  - query_solar_generation
  - search_energy_tips
  expected_response: Uses the energy balance (self-consumption rate, exported kWh) and the hourly solar profile
    of the last week, recommends shifting flexible loads (EV, appliances, heat pump/hot water) into solar hours,
    explains that exported power earns only the feed-in tariff, and cites self-consumption tips.
- id: solar_2
  question: Which days in the next three days are best for charging the car from solar?
  expected_tools:
  - estimate_pv_generation
  - search_energy_tips
  expected_response: Ranks the next three days by forecast sky condition / irradiance, names the best day(s) and
    midday hours, and estimates how much solar energy is available.
- id: history_1
  question: Suggest three ways I can reduce my electricity use based on my usage history.
  expected_tools:
  - query_energy_usage
  - search_energy_tips
  expected_response: Exactly three concrete suggestions grounded in the historical consumption by device type (EV,
    heat pump, appliances, base load) and cites knowledge-base tips.
- id: history_2
  question: Which of my devices used the most electricity in the last 7 days and what did it cost me?
  expected_tools:
  - query_energy_usage
  - search_energy_tips
  expected_response: Consumption in kWh and cost in EUR per device type for the last 7 days and identifies the largest
    consumer.
- id: savings_1
  question: If I move 10 kWh of EV charging per day from the most expensive evening hours to the cheapest hours,
    how much money and CO2 would I save per year?
  expected_tools:
  - get_electricity_prices
  - calculate_energy_savings
  - search_energy_tips
  expected_response: Uses actual expensive and cheap rates in EUR/kWh, shows the daily and annual saving in EUR,
    and explains that shifting load saves money but not CO2 in this model.
- id: storage_1
  question: I am thinking about adding a home battery. How should I charge and discharge it to save the most money?
  expected_tools:
  - get_electricity_prices
  - search_energy_tips
  expected_response: Charge from solar surplus (and very cheap hours), discharge in the most expensive hours, based
    on the price spread of the dynamic tariff and the low feed-in tariff, citing storage tips.
- id: seasonal_1
  question: Give me some energy-saving tips for the coming winter in Munich.
  expected_tools:
  - search_energy_tips
  expected_response: Winter-specific tips (heating setpoints in Celsius, heat pump operation, lower solar yield,
    ventilation) taken from the knowledge base.
- id: negative_prices_1
  question: What should I do when electricity prices are negative?
  expected_tools:
  - search_energy_tips
  expected_response: Explains that negative prices mean being paid to consume, recommends moving flexible loads
    (EV, hot water, appliances, battery) into those hours, and notes that a solar system may curtail or not earn
    feed-in then.
- id: tomorrow_prices_1
  question: What will electricity cost tomorrow at 19:00 and is that a good time to run the dryer?
  expected_tools:
  - get_electricity_prices
  - search_energy_tips
  expected_response: Gives the price for tomorrow 19:00 in EUR/kWh from the tool, compares it with the cheapest
    hours, recommends a better time if there is one, and says clearly if the prices are only an estimate.
